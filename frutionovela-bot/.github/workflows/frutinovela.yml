name: Frutinovela diaria

on:
  schedule:
    # Todos los días a las 14:00 UTC (ajusta a tu hora local)
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # te permite dispararlo manualmente desde el tab Actions

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # necesario para que el bot pueda hacer commit/push

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: 1. Generar guion del capítulo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_script.py

      - name: 2. Generar voces (TTS gratis, sin API key)
        run: python scripts/tts.py

      - name: 3. Componer el video con ffmpeg
        run: python scripts/compose_video.py

      - name: 4. Guardar el video final en videos/ del repo
        run: python scripts/save_to_repo.py

      - name: 4b. Commitear y subir el video al repo
        run: |
          git config user.name "frutinovela-bot"
          git config user.email "actions@github.com"
          git add videos/
          git commit -m "Capitulo del $(date -u +%Y-%m-%d)" || echo "Nada nuevo que commitear"
          git push

      - name: 5. Avisar por Telegram que el video ya está listo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      # Respaldo: si algo falla en la subida, el video queda disponible
      # 90 días como artefacto descargable desde el propio Actions.
      - name: Guardar como artefacto de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitulo-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14
